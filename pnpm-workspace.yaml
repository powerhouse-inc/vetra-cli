packages:
  - 'vetra-app'
  - 'vetra-cli'

catalog:
  # @powerhousedao/monorepo packages (pinned together for local-link compatibility)
  '@powerhousedao/builder-tools': '6.2.0-dev.11'
  '@powerhousedao/codegen': '6.2.0-dev.11'
  '@powerhousedao/common': '6.2.0-dev.11'
  '@powerhousedao/config': '6.2.0-dev.11'
  '@powerhousedao/connect': '6.2.0-dev.11'
  '@powerhousedao/design-system': '6.2.0-dev.11'
  '@powerhousedao/opentelemetry-instrumentation-reactor': '6.2.0-dev.11'
  '@powerhousedao/pglite-fs': '6.2.0-dev.11'
  '@powerhousedao/ph-cli': '6.2.0-dev.11'
  '@powerhousedao/powerhouse-vetra-packages': '6.2.0-dev.11'
  '@powerhousedao/reactor': '6.2.0-dev.11'
  '@powerhousedao/reactor-api': '6.2.0-dev.11'
  '@powerhousedao/reactor-attachments': '6.2.0-dev.11'
  '@powerhousedao/reactor-browser': '6.2.0-dev.11'
  '@powerhousedao/reactor-drive': '6.2.0-dev.11'
  '@powerhousedao/reactor-hypercore': '6.2.0-dev.11'
  '@powerhousedao/reactor-mcp': '6.2.0-dev.11'
  '@powerhousedao/registry': '6.2.0-dev.11'
  '@powerhousedao/shared': '6.2.0-dev.11'
  '@powerhousedao/switchboard': '6.2.0-dev.11'
  '@powerhousedao/vetra': '6.2.0-dev.11'
  '@renown/sdk': '6.2.0-dev.11'
  document-model: '6.2.0-dev.11'
  ph-cmd: '6.2.0-dev.11'

  # other shared deps
  '@powerhousedao/clint-common': '0.1.0-dev.86'
  '@powerhousedao/ph-clint': '0.1.0-dev.86'
  '@powerhousedao/ph-clint-dev': '0.1.0-dev.86'
  '@powerhousedao/ph-clint-observability': '0.1.0-dev.86'
  '@types/node': '^25.5.2'
  eslint-config-prettier: '^10.1.8'
  typescript: '^6.0.2'
  typescript-eslint: '^8.46.2'
  zod: '4.3.6'

overrides:
  'mastra>@mastra/deployer': '1.41.0'
  zod: '4.3.6'
  viem: '2.49.0'
  # Dedupe reactor-attachments to one copy (hash-first instanceof needs a single class identity).
  '@powerhousedao/reactor-attachments': '6.2.0-dev.11'

allowBuilds:
  '@apollo/protobufjs': true
  '@datadog/pprof': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  aws-sdk: true
  esbuild: true
  prisma: true
  protobufjs: true
  sqlite3: true
  unrs-resolver: true

# The repo tracks freshly-published @powerhousedao dev releases; the lockfile
# verifier ignores minimumReleaseAgeExclude (pnpm 11.5), so the age gate is off.
minimumReleaseAge: 0

minimumReleaseAgeExclude:
  - '@powerhousedao/*'
  - '@renown/*'
  - document-model
