packages:
  - 'packages/*'
  - 'vetra-app'
  - 'vetra-cli'

catalog:
  # @powerhousedao/monorepo packages (pinned together for local-link compatibility)
  '@powerhousedao/builder-tools': '6.2.0-dev.31'
  '@powerhousedao/codegen': '6.2.0-dev.31'
  '@powerhousedao/common': '6.2.0-dev.31'
  '@powerhousedao/config': '6.2.0-dev.31'
  '@powerhousedao/connect': '6.2.0-dev.31'
  '@powerhousedao/design-system': '6.2.0-dev.31'
  '@powerhousedao/opentelemetry-instrumentation-reactor': '6.2.0-dev.31'
  '@powerhousedao/pglite-fs': '6.2.0-dev.31'
  '@powerhousedao/ph-cli': '6.2.0-dev.31'
  '@powerhousedao/powerhouse-vetra-packages': '6.2.0-dev.31'
  '@powerhousedao/reactor': '6.2.0-dev.31'
  '@powerhousedao/reactor-api': '6.2.0-dev.31'
  '@powerhousedao/reactor-attachments': '6.2.0-dev.31'
  '@powerhousedao/reactor-browser': '6.2.0-dev.31'
  '@powerhousedao/reactor-drive': '6.2.0-dev.31'
  '@powerhousedao/reactor-hypercore': '6.2.0-dev.31'
  '@powerhousedao/reactor-mcp': '6.2.0-dev.31'
  '@powerhousedao/registry': '6.2.0-dev.31'
  '@powerhousedao/shared': '6.2.0-dev.31'
  '@powerhousedao/switchboard': '6.2.0-dev.31'
  '@powerhousedao/vetra': '6.2.0-dev.31'
  '@renown/sdk': '6.2.0-dev.31'
  document-model: '6.2.0-dev.31'
  ph-cmd: '6.2.0-dev.31'

  # other shared deps
  '@powerhousedao/clint-common': '0.1.0-dev.96'
  '@powerhousedao/ph-clint': '0.1.0-dev.96'
  '@powerhousedao/ph-clint-dev': '0.1.0-dev.96'
  '@powerhousedao/ph-clint-observability': '0.1.0-dev.96'
  '@types/node': '^25.5.2'
  eslint-config-prettier: '^10.1.8'
  graphql: '16.12.0'
  typescript: '^6.0.2'
  typescript-eslint: '^8.46.2'
  zod: '4.3.6'

overrides:
  'mastra>@mastra/deployer': '1.41.0'
  zod: '4.3.6'
  viem: '2.49.0'
  # Dedupe graphql to one copy: @graphql-tools schema merge does cross-instance isObjectType
  # checks, which fail when codegen builds types with a different graphql copy than Apollo pulls in.
  # Pinned to match clint-common's exact 16.12.0 anchor so the whole tree collapses to one realm.
  graphql: '16.12.0'

  # Image-size dedupe (Trim 4): each collapses a duplicate-version train in the
  # store. Reclaim measured against vetra-cli's prod closure; build/typecheck gated.
  'date-fns': '4.4.0'   # ~-11.5 MiB; all consumers on major 4 (leaner build)
  rolldown: '1.0.2'     # ~-19 MiB; collapses the rc.8/rc.17 binding train
  #
  # Not applied:
  # - @powerhousedao/shared dev-train: already collapsed by reactor-attachments -> catalog.
  # - @opentelemetry/* (~121 MiB, 81 dirs, multiple SDK majors): no single safe pin; needs an audit.
  # - zod v3 coexists with v4: a dep hard-requires v3; forcing it is breaking for ~6 MiB.

allowBuilds:
  '@apollo/protobufjs': true
  '@datadog/pprof': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  aws-sdk: true
  esbuild: true
  prisma: true
  protobufjs: true
  sqlite3: true
  unrs-resolver: true

# The repo tracks freshly-published @powerhousedao dev releases; the lockfile
# verifier ignores minimumReleaseAgeExclude (pnpm 11.5), so the age gate is off.
minimumReleaseAge: 0

minimumReleaseAgeExclude:
  - '@powerhousedao/*'
  - '@renown/*'
  - document-model
