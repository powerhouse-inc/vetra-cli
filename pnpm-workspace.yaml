# @tmpl/core (the generation engine's templates) is published on JSR only.
registries:
  '@jsr': https://npm.jsr.io

catalog:
  # @powerhousedao monorepo packages, at the version the monorepo's next/6.4
  # packages carry (pinned together for local-link compatibility).
  # cli/scripts/build-assets.ts reads the ph-cli entry as the Powerhouse version marker.
  '@powerhousedao/clint': '6.4.0-next.5'
  '@powerhousedao/clint-common': '6.4.0-next.5'
  '@powerhousedao/connect': '6.4.0-next.5'
  '@powerhousedao/design-system': '6.4.0-next.5'
  '@powerhousedao/host-core': '6.4.0-next.5'
  '@powerhousedao/ph-cli': '6.4.0-next.5'
  '@powerhousedao/powerhouse-vetra-packages': '6.4.0-next.5'
  '@powerhousedao/reactor': '6.4.0-next.5'
  '@powerhousedao/reactor-api': '6.4.0-next.5'
  '@powerhousedao/reactor-attachments': '6.4.0-next.5'
  '@powerhousedao/reactor-browser': '6.4.0-next.5'
  '@powerhousedao/shared': '6.4.0-next.5'
  '@powerhousedao/switchboard': '6.4.0-next.5'
  '@powerhousedao/vetra': '6.4.0-next.5'
  '@renown/sdk': '6.4.0-next.5'
  document-model: '6.4.0-next.5'
  ph-cmd: '6.4.0-next.5'

  # The monorepo catalog's pins, which clint and clint-common resolve: the
  # copies on both sides of a local link (or one copy, from npm) agree.
  '@mastra/core': '1.67.0'
  '@mastra/libsql': '1.23.0'
  '@mastra/mcp': '2.3.0'
  '@mastra/memory': '1.30.0'
  react: '19.2.6'
  react-dom: '19.2.6'
  '@types/react': '19.2.14'
  '@types/react-dom': '19.2.3'

  # other shared deps
  '@types/node': '^25.5.2'
  eslint-config-prettier: '^10.1.8'
  graphql: '16.12.0'
  typescript: '^6.0.2'
  typescript-eslint: '^8.46.2'
  # The monorepo's resolved zod (its catalog: ^4.5.4).
  zod: '4.6.5'

overrides:
  zod: '4.6.5'
  viem: '2.49.0'
  # Dedupe graphql to one copy: @graphql-tools schema merge does cross-instance isObjectType
  # checks, which fail when codegen builds types with a different graphql copy than Apollo pulls in.
  # Pinned to match clint-common's exact 16.12.0 anchor so the whole tree collapses to one realm.
  graphql: '16.12.0'

  # Image-size dedupe (Trim 4): each collapses a duplicate-version train in the
  # store.
  'date-fns': '4.4.0' # ~-11.5 MiB; all consumers on major 4 (leaner build)
  # ~-19 MiB; collapses the rolldown binding train. Set for the vite that
  # builder-tools built Connect with (vite 8.3.4, rolldown ~1.2.12): vite 8.3
  # emits `import.meta.ROLLDOWN_FILE_URL_*` asset refs that rolldown 1.0.x
  # doesn't know, leaving PGlite's .data/.wasm URLs undefined in the studio
  # bundle (Connect crashes: "Invalid FS bundle size"). Revisit when the
  # Connect build returns (B2); until then it only affects vitest's vite.
  rolldown: '1.2.12'

  # One copy of each of these across this checkout's tree, the transitive ones
  # of @powerhousedao/vetra-cloud-package included: the tarball declares them
  # at an older version. It is a devDependency, so these overrides and its
  # dependencies never reach an install of the published package: the build
  # inlines the model code cloud-client/ imports, and the PHDocumentController
  # it is fed into (cloud-client/controller.ts) stays the host's
  # document-model. Unscoped, so local-link's overrides replace them with
  # links to the monorepo.
  document-model: '6.4.0-next.5'
  '@powerhousedao/shared': '6.4.0-next.5'
  '@powerhousedao/builder-tools': '6.4.0-next.5'
  '@powerhousedao/common': '6.4.0-next.5'
  '@powerhousedao/connect': '6.4.0-next.5'
  '@powerhousedao/design-system': '6.4.0-next.5'
  #
  # Not applied:
  # - @opentelemetry/* (~121 MiB, 81 dirs, multiple SDK majors): no single safe pin; needs an audit.
  # - zod v3 coexists with v4: a dep hard-requires v3; forcing it is breaking for ~6 MiB.

allowBuilds:
  '@reown/appkit': true
  bufferutil: true
  keccak: true
  'utf-8-validate': true
  '@apollo/protobufjs': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  aws-sdk: true
  esbuild: true
  oxfmt: true
  prisma: true
  protobufjs: true
  sqlite3: true
  unrs-resolver: true
  '@datadog/pprof': true

# pnpm scripts and `pnpm exec` never reinstall: an install linked to the local
# monorepo (local-link) stays in place until the next explicit `pnpm install`.
verifyDepsBeforeRun: false

# The repo tracks freshly-published @powerhousedao dev releases; the lockfile
# verifier ignores minimumReleaseAgeExclude (pnpm 11.5), so the age gate is off.
minimumReleaseAge: 0

minimumReleaseAgeExclude:
  - '@powerhousedao/*'
  - '@renown/*'
  - document-model
