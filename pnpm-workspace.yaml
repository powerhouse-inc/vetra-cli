packages:
  - 'vetra-app'
  - 'vetra-cli'

catalog:
  # @powerhousedao/monorepo packages (pinned together for local-link compatibility)
  '@powerhousedao/builder-tools': '6.1.0-dev.17'
  '@powerhousedao/codegen': '6.1.0-dev.17'
  '@powerhousedao/common': '6.1.0-dev.17'
  '@powerhousedao/config': '6.1.0-dev.17'
  '@powerhousedao/connect': '6.1.0-dev.17'
  '@powerhousedao/design-system': '6.1.0-dev.17'
  '@powerhousedao/opentelemetry-instrumentation-reactor': '6.1.0-dev.17'
  '@powerhousedao/pglite-fs': '6.1.0-dev.17'
  '@powerhousedao/ph-cli': '6.1.0-dev.17'
  '@powerhousedao/powerhouse-vetra-packages': '6.1.0-dev.17'
  '@powerhousedao/reactor': '6.1.0-dev.17'
  '@powerhousedao/reactor-api': '6.1.0-dev.17'
  '@powerhousedao/reactor-attachments': '6.1.0-dev.17'
  '@powerhousedao/reactor-browser': '6.1.0-dev.17'
  '@powerhousedao/reactor-drive': '6.1.0-dev.17'
  '@powerhousedao/reactor-hypercore': '6.1.0-dev.17'
  '@powerhousedao/reactor-mcp': '6.1.0-dev.17'
  '@powerhousedao/registry': '6.1.0-dev.17'
  '@powerhousedao/shared': '6.1.0-dev.17'
  '@powerhousedao/switchboard': '6.1.0-dev.17'
  '@powerhousedao/vetra': '6.1.0-dev.17'
  '@renown/sdk': '6.1.0-dev.17'
  document-model: '6.1.0-dev.17'
  ph-cmd: '6.1.0-dev.17'

  # other shared deps
  '@powerhousedao/clint-common': '0.1.0-dev.82'
  '@powerhousedao/ph-clint': '0.1.0-dev.82'
  '@powerhousedao/ph-clint-dev': '0.1.0-dev.82'
  '@powerhousedao/ph-clint-observability': '0.1.0-dev.82'
  '@types/node': '^25.5.2'
  eslint-config-prettier: '^10.1.8'
  typescript: '^6.0.2'
  typescript-eslint: '^8.46.2'
  zod: '4.3.6'

overrides:
  'mastra>@mastra/deployer': '1.22.0'
  zod: '4.3.6'
  viem: '2.49.0'

allowBuilds:
  '@apollo/protobufjs': true
  '@datadog/pprof': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  aws-sdk: true
  esbuild: true
  prisma: true
  protobufjs: true
  sqlite3: true
  unrs-resolver: true

# The repo tracks freshly-published @powerhousedao dev releases; the lockfile
# verifier ignores minimumReleaseAgeExclude (pnpm 11.5), so the age gate is off.
minimumReleaseAge: 0

minimumReleaseAgeExclude:
  - '@powerhousedao/analytics-engine-browser@6.1.0-dev.17'
  - '@powerhousedao/analytics-engine-core@6.1.0-dev.17'
