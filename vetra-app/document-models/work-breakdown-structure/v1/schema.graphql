type WorkBreakdownStructureState {
  feature: FeatureRef
  name: String
  description: String
  packages: [WorkPackage!]!
  tasks: [Task!]!
  status: WbsStatus!
}

type WorkPackage {
  id: OID!
  parentPackageId: OID
  name: String!
  description: String
}

type Task {
  id: OID!
  packageId: OID
  name: String!
  description: String
  taskKind: [TaskKind!]!
  targetSpec: SpecRef
  targetOutcomes: [OutcomeRef!]!
  acceptanceCriteria: String
  status: TaskStatus!
  owner: String
  session: SessionRef
  plannedIn: SessionRef
  dependsOn: [TaskRef!]!
  parentFeature: FeatureRef
  startedAt: DateTime
  completedAt: DateTime
  notes: String
}

type FeatureRef {
  documentId: PHID!
  name: String
  status: String
}

type SpecRef {
  documentId: PHID!
  name: String
  kind: String
}

type OutcomeRef {
  id: OID!
  documentId: PHID!
  objectId: OID!
  statement: String
  scope: String
}

type SessionRef {
  documentId: PHID!
  agent: String
  model: String
}

type TaskRef {
  id: OID!
  documentId: PHID!
  objectId: OID!
  name: String
  status: String
}

enum WbsStatus {
  DRAFT
  ACTIVE
  COMPLETE
  ARCHIVED
}

enum TaskKind {
  SPEC_CHANGE
  IMPLEMENTATION
  INTEGRATION
  TESTING
  REVIEW
  DOCUMENTATION
  MAINTENANCE
}

enum TaskStatus {
  TODO
  IN_PROGRESS
  REVIEW
  DONE
  BLOCKED
  DROPPED
}

