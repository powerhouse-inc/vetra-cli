# Studio Product: the single read model the Studio page renders from.
# Natural keys (F54): ProductStep, CheckResult and LaunchLine are keyed by
# their `kind`, Version by `number`, PackageVersion by `name`; reducers keep
# them unique within their list.

enum StepKind {
  PLAN
  DATA
  EDITORS
  TESTS
  LIVE
}

enum StepStatus {
  NOT_STARTED
  WORKING
  DONE
  NEEDS_YOU
  STOPPED
  LIVE
}

enum ChangeKind {
  FIRST_BUILD
  CHANGE
  UNDO
  BEFORE_VERSIONS
}

enum ChangeStatus {
  BUILDING
  PAUSED
  READY
  LAUNCHING
  LAUNCHED
  DISCARDED
  FAILED
  CLOSED
}

enum CheckKind {
  GENERATE
  TYPECHECK
  LINT
  REDUCER_TESTS
  SMOKE
}

enum ProductAccess {
  SIGNED_IN
  OWNER_ONLY
}

enum LiveHealth {
  UNKNOWN
  HEALTHY
  UNHEALTHY
}

enum PermissionState {
  UNKNOWN
  GRANTED
  MISSING
  EXPIRED
}

enum RequestKind {
  LAUNCH
  ROLLBACK
  DISCARD
  RESTART
  MIRROR
}

enum VersionStatus {
  LAUNCHING
  LIVE
  PREVIOUS
  FAILED
}

enum LaunchLineKind {
  SNAPSHOT
  PUBLISH
  DEPLOY
  VERIFY
  MIRROR
}

enum LineStatus {
  WAITING
  RUNNING
  DONE
  FAILED
  SKIPPED
}

enum SuggestionStatus {
  OPEN
  USED
  DISMISSED
}

enum GithubStatus {
  NOT_CONNECTED
  CONNECTED
  DISCONNECTED
  PUSH_FAILED
}

type ProductStep {
  kind: StepKind!
  status: StepStatus!
  done: Int
  total: Int
  label: String
  reason: String
  updatedAt: DateTime
}

type Milestone {
  id: OID!
  text: String!
  at: DateTime!
  recovered: Boolean!
}

type CheckResult {
  kind: CheckKind!
  passed: Boolean!
  reason: String
}

type CheckRun {
  id: OID!
  at: DateTime!
  results: [CheckResult!]!
}

type Stuck {
  reason: String!
  tried: [String!]!
  at: DateTime!
}

type ChangeMetrics {
  steps: Int!
  firstPreviewAt: DateTime
  readyAt: DateTime
  liveAt: DateTime
}

type Change {
  id: OID!
  kind: ChangeKind!
  request: String!
  title: String
  chatSessionId: PHID
  chatSessionIds: [PHID!]!
  status: ChangeStatus!
  startedAt: DateTime!
  steps: [ProductStep!]!
  milestones: [Milestone!]!
  checkRuns: [CheckRun!]!
  stuck: Stuck
  metrics: ChangeMetrics!
  lintWaivedAt: DateTime
}

type PackageVersion {
  name: String!
  version: String!
}

type LaunchLine {
  kind: LaunchLineKind!
  status: LineStatus!
  detail: String
}

type Version {
  number: Int!
  title: String!
  summary: String
  changeId: OID
  gitTag: String!
  sha: String!
  packages: [PackageVersion!]!
  deploymentId: String
  launchedAt: DateTime
  launchedBy: String!
  trigger: String!
  status: VersionStatus!
  lines: [LaunchLine!]!
  changedFiles: [String!]!
  failure: String
  rollbackBlockedReason: String
}

type PendingRequest {
  kind: RequestKind!
  changeId: OID
  targetVersion: Int
  requestedAt: DateTime!
  requestedBy: String!
}

type RequestFailure {
  kind: RequestKind!
  reason: String!
  at: DateTime!
}

type Suggestion {
  id: OID!
  text: String!
  afterVersion: Int!
  status: SuggestionStatus!
}

type GithubLink {
  status: GithubStatus!
  repoFullName: String
  lastError: String
  externalChangesSha: String
}

type StudioProductState {
  name: String
  idea: String
  slug: String
  liveUrl: URL
  appId: String
  productionEnvironmentId: String
  productDriveId: PHID
  createdAt: DateTime
  access: ProductAccess!
  changes: [Change!]!
  activeChangeId: OID
  liveVersion: Int
  liveSince: DateTime
  liveDeploymentId: String
  versions: [Version!]!
  health: LiveHealth!
  pendingRequest: PendingRequest
  lastRequestFailure: RequestFailure
  launchPermission: PermissionState!
  suggestions: [Suggestion!]!
  github: GithubLink!
}


