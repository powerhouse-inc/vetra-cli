# Studio Product: the single read model the Studio page renders from.
# Natural keys (F54): ProductStep, CheckResult and LaunchLine are keyed by
# their `kind`, Version by `number`, PackageVersion by `name`; reducers keep
# them unique within their list.

enum StepKind {
  PLAN
  DATA
  EDITORS
  TESTS
  LIVE
}

enum StepStatus {
  NOT_STARTED
  WORKING
  DONE
  NEEDS_YOU
  STOPPED
  LIVE
}

enum ChangeKind {
  FIRST_BUILD
  CHANGE
  UNDO
  BEFORE_VERSIONS
}

enum ChangeStatus {
  BUILDING
  PAUSED
  READY
  LAUNCHING
  LAUNCHED
  DISCARDED
  FAILED
  CLOSED
}

enum CheckKind {
  GENERATE
  TYPECHECK
  LINT
  REDUCER_TESTS
  SMOKE
}

enum ProductAccess {
  SIGNED_IN
  OWNER_ONLY
}

enum LiveHealth {
  UNKNOWN
  HEALTHY
  UNHEALTHY
}

enum PermissionState {
  UNKNOWN
  GRANTED
  MISSING
  EXPIRED
}

enum RequestKind {
  LAUNCH
  ROLLBACK
  DISCARD
  RESTART
  MIRROR
}

enum VersionStatus {
  LAUNCHING
  LIVE
  PREVIOUS
  FAILED
}

enum LaunchLineKind {
  SNAPSHOT
  PUBLISH
  DEPLOY
  VERIFY
  MIRROR
}

enum LineStatus {
  WAITING
  RUNNING
  DONE
  FAILED
  SKIPPED
}

enum SuggestionStatus {
  OPEN
  USED
  DISMISSED
}

enum SuggestionKind {
  IDEA
  REVIEW
}

enum VariantLabel {
  A
  B
}

enum VariantStatus {
  BUILDING
  READY
  FAILED
  KEPT
  DISCARDED
}

enum OriginMode {
  REMIX
  COMPOSE
}

enum PublicSourceKind {
  GITHUB
  PACKAGE
}

enum MaterialKind {
  PICTURE
  PDF
  SHEET
  TEXT
}

enum GuidedLoopStatus {
  NOT_STARTED
  POINTED
  CHANGED
  WENT_BACK
  DONE
  DISMISSED
}

enum RowImportStatus {
  CONFIRMED
  DONE
  FAILED
}

enum QuestionAnswerBy {
  ROOM
  DEFAULT
}

enum GithubStatus {
  NOT_CONNECTED
  CONNECTED
  DISCONNECTED
  PUSH_FAILED
}

type ProductStep {
  kind: StepKind!
  status: StepStatus!
  done: Int
  total: Int
  label: String
  reason: String
  updatedAt: DateTime
}

type Milestone {
  id: OID!
  text: String!
  at: DateTime!
  recovered: Boolean!
  # One customer-facing sentence (<= 120 chars) for the Outcome layer.
  outcome: String
}

type CheckResult {
  kind: CheckKind!
  passed: Boolean!
  reason: String
}

type CheckRun {
  id: OID!
  at: DateTime!
  results: [CheckResult!]!
}

type Stuck {
  reason: String!
  tried: [String!]!
  at: DateTime!
}

type ChangeMetrics {
  steps: Int!
  firstPreviewAt: DateTime
  readyAt: DateTime
  liveAt: DateTime
}

type Change {
  id: OID!
  kind: ChangeKind!
  request: String!
  title: String
  chatSessionId: PHID
  chatSessionIds: [PHID!]!
  status: ChangeStatus!
  startedAt: DateTime!
  steps: [ProductStep!]!
  milestones: [Milestone!]!
  checkRuns: [CheckRun!]!
  stuck: Stuck
  metrics: ChangeMetrics!
  lintWaivedAt: DateTime
  variants: [Variant!]!
  questions: [RoomQuestion!]!
  cost: ChangeCost
}

# One of two ways to build a change ("Show me two ways"), on its own branch.
type Variant {
  label: VariantLabel!
  branch: String!
  status: VariantStatus!
  chatSessionId: PHID
  summary: String
}

type PackageVersion {
  name: String!
  version: String!
}

type LaunchLine {
  kind: LaunchLineKind!
  status: LineStatus!
  detail: String
}

type Version {
  number: Int!
  title: String!
  summary: String
  changeId: OID
  gitTag: String!
  sha: String!
  packages: [PackageVersion!]!
  deploymentId: String
  launchedAt: DateTime
  launchedBy: String!
  trigger: String!
  status: VersionStatus!
  lines: [LaunchLine!]!
  changedFiles: [String!]!
  failure: String
  rollbackBlockedReason: String
}

type PendingRequest {
  kind: RequestKind!
  changeId: OID
  targetVersion: Int
  requestedAt: DateTime!
  requestedBy: String!
}

type RequestFailure {
  kind: RequestKind!
  reason: String!
  at: DateTime!
}

type Suggestion {
  id: OID!
  text: String!
  afterVersion: Int!
  status: SuggestionStatus!
  kind: SuggestionKind!
  # Attachment ref or URL of the screen a review finding is about.
  screenshot: String
}

type GithubLink {
  status: GithubStatus!
  repoFullName: String
  lastError: String
  externalChangesSha: String
}

# An environment that already ran this workspace's packages before the
# product had versions (spec 6.6): shown as live until Version 1.
type LiveBeforeVersions {
  environmentId: String!
  url: URL!
  at: DateTime!
}

# A published package this product was remixed from or composes (keyed by
# packageName).
type ProductOrigin {
  packageName: String!
  version: String!
  mode: OriginMode!
  license: String!
  sourceUrl: URL
  sourceRef: String
  at: DateTime!
  missing: [String!]!
  latestVersion: String
  checkedAt: DateTime
}

# Notes from people using the live product (opt-in).
type NotesSettings {
  enabled: Boolean!
  since: DateTime
}

type PublicSource {
  kind: PublicSourceKind!
  url: URL!
  version: Int!
}

# A question the agent asks the room while building a change; answered by
# the room or, after a while, by its default.
type RoomQuestion {
  id: OID!
  text: String!
  options: [String!]!
  defaultAnswer: String!
  language: String!
  askedAt: DateTime!
  answer: String
  answeredAt: DateTime
  answeredBy: QuestionAnswerBy
}

# What a change cost in model usage, in US dollars: the meter at its start
# and at its end.
type ChangeCost {
  startUsd: Float
  endUsd: Float
}

# A material (picture, PDF, sheet, text) the understanding was built from.
type MaterialRef {
  id: OID!
  name: String!
  kind: MaterialKind!
}

# What the agent understood from the idea and the materials, confirmed with
# "Build this".
type Understood {
  json: String!
  language: String!
  at: DateTime!
  materials: [MaterialRef!]!
}

# Progress through the guided first loop (point, change, go back, done).
type GuidedLoop {
  status: GuidedLoopStatus!
  at: DateTime
}

# Rows of a sheet imported as documents.
type RowImport {
  id: OID!
  materialId: OID!
  sheet: String!
  documentType: String!
  rows: Int!
  imported: Int!
  status: RowImportStatus!
  at: DateTime!
  failure: String
}

type StudioProductState {
  name: String
  idea: String
  slug: String
  liveUrl: URL
  appId: String
  productionEnvironmentId: String
  productDriveId: PHID
  createdAt: DateTime
  access: ProductAccess!
  changes: [Change!]!
  activeChangeId: OID
  liveVersion: Int
  liveSince: DateTime
  liveDeploymentId: String
  versions: [Version!]!
  health: LiveHealth!
  pendingRequest: PendingRequest
  lastRequestFailure: RequestFailure
  launchPermission: PermissionState!
  suggestions: [Suggestion!]!
  github: GithubLink!
  liveBeforeVersions: LiveBeforeVersions
  origins: [ProductOrigin!]!
  notes: NotesSettings!
  publicSource: PublicSource
  sourceNoticeAcceptedAt: DateTime
  understood: Understood
  explainersSeen: [String!]!
  guidedLoop: GuidedLoop!
  rowImports: [RowImport!]!
}


