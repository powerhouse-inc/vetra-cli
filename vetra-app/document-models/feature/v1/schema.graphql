type FeatureState {
  name: String
  summary: String
  scope: FeatureScope!
  premise: String
  expectedEffect: String
  reasoning: String
  targets: [OutcomeTarget!]!
  segments: [SegmentRef!]!
  role: RoleRef
  relatedStep: JobStepRef
  confidence: Confidence
  effort: Effort
  impact: Impact
  targetRelease: String
  evidence: [Evidence!]!
  notes: String
  status: FeatureStatus!
  promotion: PromotionEvent
  parentFeature: FeatureRef
  wbs: WbsRef
  agentFeedback: AgentFeedback!
}

type OutcomeTarget {
  id: OID!
  outcome: OutcomeRef!
  expectedImportanceChange: Int
  expectedSatisfactionChange: Int
  notes: String
}

type OutcomeRef {
  documentId: PHID!
  objectId: OID!
  statement: String
  scope: String
}

type SegmentRef {
  id: OID!
  documentId: PHID!
  objectId: OID!
  name: String
  description: String
}

type RoleRef {
  documentId: PHID!
  objectId: OID!
  name: String
  kind: String
}

type JobStepRef {
  documentId: PHID!
  objectId: OID!
  name: String
  category: String
}

type FeatureRef {
  documentId: PHID!
  name: String
  status: String
}

type WbsRef {
  documentId: PHID!
  name: String
  status: String
}

type PromotionEvent {
  promotedAt: DateTime!
  promotedBy: String
  rationale: String
}

type Evidence {
  id: OID!
  source: EvidenceSource!
  recordedAt: DateTime
  content: String!
}

enum EvidenceSource {
  BUILDER
  AI_SIMULATION
  USER_RESEARCH
}

enum FeatureScope {
  MICRO_MVP
  MARKET_MVP
  INCREMENTAL
  MAINTENANCE
}

enum FeatureStatus {
  PROPOSED
  EVALUATING
  COMMITTED
  IN_SPEC
  ARCHIVED
  PARKED
}

enum Confidence {
  LOW
  MEDIUM
  HIGH
}

enum Effort {
  SMALL
  MEDIUM
  LARGE
}

enum Impact {
  LOW
  MEDIUM
  HIGH
}

type AgentFeedback {
  readyForFeedback: Boolean!
  suggestions: [Suggestion!]!
}

type Suggestion {
  id: OID!
  createdAt: DateTime!
  agent: String!
  content: String!
  resolution: SuggestionResolution
}

type SuggestionResolution {
  resolvedAt: DateTime!
  decision: SuggestionDecision!
  comment: String
  changeApplied: Boolean!
}

enum SuggestionDecision {
  ACCEPTED
  DISMISSED
}

