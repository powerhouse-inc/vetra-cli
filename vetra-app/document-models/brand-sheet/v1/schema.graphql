type BrandSheetState {
  name: String
  maxim: String
  concept: String
  logos: [Logo!]!
  colors: [Color!]!
  typography: [Typeface!]!
  voice: Voice
  imagery: Imagery
  agentFeedback: AgentFeedback!
}

type Logo {
  id: OID!
  description: String!
  markType: MarkType!
  assetData: String
  assetMediaType: String
  assetFilename: String
  assetUrl: URL
}

enum MarkType {
  WORDMARK
  SYMBOL
  COMBINATION
}

type Color {
  id: OID!
  role: ColorRole!
  name: String!
  hex: String!
  usage: String!
}

enum ColorRole {
  PRIMARY
  SURFACE
  ACCENT
  SECONDARY
  TEXT
}

type Typeface {
  id: OID!
  role: TypeRole!
  family: String!
  alternatives: [String!]!
  notes: String
}

enum TypeRole {
  HEADLINE
  BODY
  UI
  NUMERALS
}

type Voice {
  qualities: [String!]!
  guidance: String!
  vocabulary: Vocabulary!
}

type Vocabulary {
  prefer: [String!]!
  avoid: [String!]!
}

type Imagery {
  direction: String
  include: [String!]!
  avoid: [String!]!
  references: [ImageRef!]!
}

type ImageRef {
  id: OID!
  data: String
  mediaType: String
  filename: String
  url: URL
}

type AgentFeedback {
  readyForFeedback: Boolean!
  suggestions: [Suggestion!]!
}

type Suggestion {
  id: OID!
  createdAt: DateTime!
  agent: String!
  content: String!
  resolution: SuggestionResolution
}

type SuggestionResolution {
  resolvedAt: DateTime!
  decision: SuggestionDecision!
  comment: String
  changeApplied: Boolean!
}

enum SuggestionDecision {
  ACCEPTED
  DISMISSED
}

# identity

input SetProductNameInput {
  name: String!
}

input ClearProductNameInput {
  _: Boolean
}

input SetMaximInput {
  maxim: String!
}

input ClearMaximInput {
  _: Boolean
}

input SetConceptInput {
