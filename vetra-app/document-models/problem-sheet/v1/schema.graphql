input RemoveRoleInput {
  id: OID!
}

input ReorderRolesInput {
  ids: [OID!]!
  insertBefore: OID
}

input SetRoleSpecializedJobInput {
  roleId: OID!
  motivation: Motivation!
  verb: String!
  object: String!
  clarifier: String
}

input UpdateRoleSpecializedJobInput {
  roleId: OID!
  motivation: Motivation
  verb: String
  object: String
  clarifier: String
}

input ClearRoleSpecializedJobInput {
  roleId: OID!
}

input AddSpecializedJobStepInput {
  roleId: OID!
  id: OID!
  name: String!
  category: JobMapStep!
  description: String
  insertBefore: OID
}

input UpdateSpecializedJobStepInput {
  roleId: OID!
  id: OID!
  name: String
  category: JobMapStep
  description: String
}

input RemoveSpecializedJobStepInput {
  roleId: OID!
  id: OID!
}

input ReorderSpecializedJobStepsInput {
  roleId: OID!
  ids: [OID!]!
  insertBefore: OID
}

# outcomes

input AddOutcomeInput {
  id: OID!
  direction: OutcomeDirection!
  object: String!
  scope: OutcomeScope!
  metric: String
  clarifier: String
  role: OID
  relatedStep: OID
  notes: String
  insertBefore: OID
}

input UpdateOutcomeInput {
  id: OID!
  direction: OutcomeDirection
  object: String
  scope: OutcomeScope
  metric: String
  clarifier: String
  role: OID
  relatedStep: OID
  notes: String
}

input RemoveOutcomeInput {
  id: OID!
