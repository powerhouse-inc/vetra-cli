type ProblemSheetState {
  context: String
  coreJob: JobStatement
  coreJobSteps: [JobStep!]!
  roles: [Role!]!
  outcomes: [Outcome!]!
  constraints: [Constraint!]!
  agentFeedback: AgentFeedback!
}

type JobStatement {
  motivation: Motivation!
  verb: String!
  object: String!
  clarifier: String
}

enum Motivation {
  LOVE_TO
  WANT_TO
  NEED_TO
  HAVE_TO
  HATE_TO
  CANNOT
}

type JobStep {
  id: OID!
  name: String!
  category: JobMapStep!
  description: String
}

enum JobMapStep {
  DEFINE
  LOCATE
  PREPARE
  CONFIRM
  EXECUTE
  MONITOR
  MODIFY
  CONCLUDE
}

type Role {
  id: OID!
  name: String!
  description: String
  context: String
  kind: RoleKind!
  specializedJob: SpecializedJob
}

enum RoleKind {
  PRIMARY
  SUPPORT
}

type SpecializedJob {
  motivation: Motivation!
  verb: String!
  object: String!
  clarifier: String
  steps: [JobStep!]!
}

type Outcome {
  id: OID!
  direction: OutcomeDirection!
  metric: String
  object: String!
  clarifier: String
  scope: OutcomeScope!
  role: OID
  relatedStep: OID
  notes: String
}

enum OutcomeDirection {
  INCREASE
  DECREASE
  SATISFY
  AVOID
}

enum OutcomeScope {
  CORE
  SPECIALIZED
  OPERATIONAL
}

type Constraint {
  id: OID!
  description: String!
  severity: Severity!
  notes: String
}

enum Severity {
  LOW
  MEDIUM
  HIGH
}

type AgentFeedback {
  readyForFeedback: Boolean!
  suggestions: [Suggestion!]!
}

type Suggestion {
  id: OID!
  createdAt: DateTime!
  agent: String!
  content: String!
  resolution: SuggestionResolution
}

type SuggestionResolution {
  resolvedAt: DateTime!
  decision: SuggestionDecision!
  comment: String
  changeApplied: Boolean!
}

enum SuggestionDecision {
  ACCEPTED
  DISMISSED
}

# context

input SetContextInput {
  context: String!
}

input ClearContextInput {
  _: Boolean
}

# core_job

input SetCoreJobInput {
  motivation: Motivation!
  verb: String!
  object: String!
  clarifier: String
}

input UpdateCoreJobInput {
  motivation: Motivation
  verb: String
  object: String
  clarifier: String
}

input ClearCoreJobInput {
  _: Boolean
}

# job_steps

input AddJobStepInput {
  id: OID!
  name: String!
  category: JobMapStep!
  description: String
  insertBefore: OID
}

input UpdateJobStepInput {
  id: OID!
  name: String
  category: JobMapStep
  description: String
}

input RemoveJobStepInput {
  id: OID!
}

input ReorderJobStepsInput {
  ids: [OID!]!
  insertBefore: OID
}

