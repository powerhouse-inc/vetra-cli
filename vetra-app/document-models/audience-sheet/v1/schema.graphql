input UpdateOutcomePriorityInput {
  segmentId: OID!
  id: OID!
  importance: Int
  satisfaction: Int
  source: EvidenceSource
  notes: String
}

input UpdateOutcomePrioritySnippetInput {
  segmentId: OID!
  id: OID!
  statement: String
