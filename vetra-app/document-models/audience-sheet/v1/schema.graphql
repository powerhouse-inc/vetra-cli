}

input RemoveOutcomePriorityInput {
  segmentId: OID!
  id: OID!
}

input ReorderOutcomePrioritiesInput {
  segmentId: OID!
  ids: [OID!]!
  insertBefore: OID
}

input AddSegmentEvidenceInput {
  segmentId: OID!
  id: OID!
  source: EvidenceSource!
  content: String!
  recordedAt: DateTime
  insertBefore: OID
}

input UpdateSegmentEvidenceInput {
  segmentId: OID!
  id: OID!
  source: EvidenceSource
  content: String
  recordedAt: DateTime
}

input RemoveSegmentEvidenceInput {
  segmentId: OID!
  id: OID!
}

# agent_feedback

input SetReadyForFeedbackInput {
  ready: Boolean!
}

input AddSuggestionInput {
  id: OID!
  createdAt: DateTime!
  agent: String!
  content: String!
}

input ResolveSuggestionInput {
  id: OID!
  resolvedAt: DateTime!
  decision: SuggestionDecision!
  comment: String
  changeApplied: Boolean!
}

input RemoveSuggestionInput {
  id: OID!
}