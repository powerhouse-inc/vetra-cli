name: e2e-prodclose

# Prod-close end-to-end: publish vetra-cli + vetra-app to a disposable local
# registry against the released (catalog-pinned) ph-clint, build the clint-agent
# image the prod way (hoisted `pnpm add -g`), run it, and assert the studio
# contract. Thin wrapper around lab/ci/run-prodclose-e2e.sh — the same script a
# developer runs locally with docker.
on:
  pull_request:
  workflow_dispatch:

jobs:
  prodclose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The base image (clint-runtime) is self-contained (FROM node:24-bookworm-slim,
      # no ph-clint source) and is built from lab/base-image by the entrypoint when
      # absent. No registry secrets needed.
      - name: Run prod-close e2e
        run: ./lab/ci/run-prodclose-e2e.sh

      - name: Dump studio logs on failure
        if: failure()
        run: docker logs vetra-studio-prodclose 2>&1 | tail -200 || true
