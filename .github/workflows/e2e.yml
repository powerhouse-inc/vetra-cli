name: e2e

# e2e job — two checks run in parallel as matrix legs:
#   source — from-source seeded Playwright e2e (boots the studio via tsx, drives
#            the chat UI, asserts the generated editor renders). Fast tripwire.
#   docker — prod-close: publish + build the clint-agent image the prod way and
#            assert the studio HTTP contract (lab/ci/run-prodclose-e2e.sh).
# fail-fast (matrix default) cancels the in-progress sibling on the first
# failure, so a broken source check aborts the slow docker build early.
#
# global-install job — lighter coverage of the plain global-install path on a
# vanilla node:24 image (npm + pnpm matrix). See the job for details.
on:
  pull_request:
    paths:
      - "vetra-cli/src/**"
      - "vetra-cli/e2e/**"
      - "vetra-cli/package.json"
      - "vetra-cli/Dockerfile"
      - "vetra-app/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "lab/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

# A new push on the same ref cancels the in-progress run.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps-guard:
    name: deps guard (zero runtime deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # node 24 strips TS types natively — no install needed.
      - name: Assert vetra-cli declares no runtime deps
        run: node vetra-cli/scripts/check-runtime-deps.ts

  e2e:
    name: e2e (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: true
      matrix:
        leg: [source, docker]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # --- source leg ------------------------------------------------------
      - name: Install workspace
        if: matrix.leg == 'source'
        run: pnpm install --frozen-lockfile

      - name: Build vetra-app (studio + connect)
        if: matrix.leg == 'source'
        run: |
          pnpm --filter vetra-app build
          pnpm --filter vetra-app build:connect

      - name: Generate vetra-cli assets
        if: matrix.leg == 'source'
        run: pnpm --filter vetra-cli build:assets

      # The studio shells out to `ph` for the reactor-project; CI has no global
      # `ph`, so install ph-cmd onto a pnpm global-bin dir that's on PATH (the
      # version matches DEFAULT_PH_VERSION). Without this the studio's ensure-ph
      # hook tries the install at boot and `pnpm add -g` fails (bin dir not on
      # PATH under pnpm/action-setup).
      - name: Install ph CLI
        if: matrix.leg == 'source'
        run: |
          export PNPM_HOME="$HOME/.pnpm-global"
          mkdir -p "$PNPM_HOME"
          pnpm config set global-bin-dir "$PNPM_HOME"
          export PATH="$PNPM_HOME:$PATH"
          PH_VERSION=$(node -p "require('fs').readFileSync('vetra-cli/src/ph-version.gen.ts','utf8').match(/'([^']+)'/)[1]")
          echo "installing ph-cmd@$PH_VERSION"
          pnpm add -g "ph-cmd@$PH_VERSION" \
            --config.blockExoticSubdeps=false --config.minimumReleaseAge=0
          ph --version
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"
          echo "$PNPM_HOME" >> "$GITHUB_PATH"

      - name: Cache inner-build pnpm store
        if: matrix.leg == 'source'
        uses: actions/cache@v4
        with:
          path: /tmp/vetra-e2e-pnpm-store
          key: vetra-e2e-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: vetra-e2e-store-

      - name: Install Playwright Chromium
        if: matrix.leg == 'source'
        run: pnpm --filter vetra-cli exec playwright install --with-deps chromium

      - name: Run seeded e2e
        if: matrix.leg == 'source'
        run: pnpm --filter vetra-cli test:e2e

      - name: Dump studio + service logs on failure
        if: failure() && matrix.leg == 'source'
        run: |
          echo "=== studio.log (tail) ==="
          tail -200 vetra-cli/e2e/.cache/studio.log 2>/dev/null || echo "(none)"
          echo "=== service logs (incl. inner ph vetra) ==="
          for f in vetra-cli/e2e/.cache/service-logs/*; do
            [ -e "$f" ] || continue
            echo "--- $f ---"; tail -150 "$f" 2>/dev/null
          done

      - name: Upload seeded-e2e artifacts on failure
        if: failure() && matrix.leg == 'source'
        uses: actions/upload-artifact@v4
        with:
          name: seeded-e2e-report
          path: |
            vetra-cli/e2e/playwright-report/
            vetra-cli/e2e/.cache/studio.log
            vetra-cli/e2e/.cache/service-logs/
          retention-days: 7

      # --- docker leg ------------------------------------------------------
      - name: Set up Docker Buildx
        if: matrix.leg == 'docker'
        uses: docker/setup-buildx-action@v3

      - name: Run prod-close e2e
        if: matrix.leg == 'docker'
        run: ./lab/ci/run-prodclose-e2e.sh

      - name: Dump studio logs on failure
        if: failure() && matrix.leg == 'docker'
        run: docker logs vetra-studio-prodclose 2>&1 | tail -200 || true

  # Strongest global-install signal: prove the published package installs as a
  # plain global install on a vanilla node image AND boots the full seeded replay
  # studio from that global bin. vetra-cli's runtime deps are public (the
  # @powerhousedao/* entries are catalog: pins to versions on public npm; pnpm
  # pack inlines catalog: -> concrete), so vetra-cli itself is the only non-public
  # package — its tarball's whole closure resolves from public npm, no lab
  # registry needed. Build + pack run on the host runner (needs the pnpm
  # workspace); the global install + replay run inside a basic node:24 container
  # (NOT the custom prod Dockerfile). The studio-under-test is the global `vetra`
  # (VETRA_E2E_BOOT_CMD=vetra); Playwright drives the recorded replay and asserts
  # the generated editor renders. fail-fast: false so npm and pnpm don't mask
  # each other.
  global-install:
    name: global-install (${{ matrix.pm }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # build:assets bundles vetra-app/dist/connect into vetra-cli/dist, so the
      # studio SPA ships in the tarball — build vetra-app first (matches the
      # source leg order).
      - name: Build vetra-app (studio + connect)
        run: |
          pnpm --filter vetra-app build
          pnpm --filter vetra-app build:connect

      - name: Build vetra-cli
        run: pnpm --filter vetra-cli build

      # pnpm pack inlines catalog: -> concrete and workspace:* -> a real version,
      # so the tarball's deps are all public.
      - name: Pack vetra-cli
        run: |
          cd vetra-cli
          TARBALL=$(pnpm pack | tail -1)
          cp "$TARBALL" "$GITHUB_WORKSPACE/vetra-cli.tgz"
          echo "packed $TARBALL"

      # ph-cmd (the `ph` bin) is installed up front so the ensure-ph lifecycle
      # hook — which runs on every command's onInit and would otherwise shell out
      # to `pnpm add -g` — is a no-op. Pin matches DEFAULT_PH_VERSION.
      - name: Resolve ph version
        id: ph
        run: |
          PH_VERSION=$(node -p "require('fs').readFileSync('vetra-cli/src/ph-version.gen.ts','utf8').match(/'([^']+)'/)[1]")
          echo "version=$PH_VERSION" >> "$GITHUB_OUTPUT"
          echo "ph version: $PH_VERSION"

      # Global-install vetra from the tarball (matrix PM) on a vanilla node:24,
      # then run the FULL seeded replay against that global bin: the studio under
      # test is the global `vetra` (VETRA_E2E_BOOT_CMD=vetra), Playwright drives
      # the recorded fixture and asserts the generated editor renders.
      # The repo's e2e harness (config/specs/support/fixtures) is mounted in and
      # provisioned with @playwright/test + tsx; .cache is bound out for artifacts.
      - name: Global install + seeded replay (${{ matrix.pm }}) on node:24
        env:
          PM: ${{ matrix.pm }}
          PH_VERSION: ${{ steps.ph.outputs.version }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/e2e-cache"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/vetra-cli.tgz:/t.tgz:ro" \
            -v "$GITHUB_WORKSPACE/vetra-cli/e2e:/e2e-src:ro" \
            -v "$GITHUB_WORKSPACE/e2e-cache:/out" \
            -e PM -e PH_VERSION \
            node:24 bash -eu -c '
              echo "=== node $(node --version) / pm=$PM ==="

              # pnpm on PATH for BOTH legs: the inner reactor-project shells out to
              # `ph init --pnpm`, which needs pnpm regardless of the global-install PM.
              # Pin 11.5.0 + COREPACK_DEFAULT_TO_LATEST=0 so the inner pnpm does not
              # float to a newer release whose lockfile supply-chain verifier rejects
              # fresh @powerhousedao dev.N entries on minimumReleaseAge.
              export COREPACK_DEFAULT_TO_LATEST=0
              corepack enable
              corepack prepare pnpm@11.5.0 --activate
              export PNPM_HOME=/root/.pnpm-global
              mkdir -p "$PNPM_HOME"
              pnpm config set global-bin-dir "$PNPM_HOME"
              export PATH="$PNPM_HOME:$PATH"

              # Global-install vetra + ph-cmd with the matrix PM.
              if [ "$PM" = npm ]; then
                npm install -g "ph-cmd@$PH_VERSION" /t.tgz
              else
                # blockExoticSubdeps=false: closure hits a URL subdep via viem -> ox.
                # minimumReleaseAge=0: pnpm 11 defaults to 24h; pins are fresh dev.N.
                pnpm add -g "ph-cmd@$PH_VERSION" /t.tgz \
                  --config.blockExoticSubdeps=false --config.minimumReleaseAge=0
              fi

              # Fast pre-check before the heavy replay.
              command -v ph; command -v vetra
              ph --version
              vetra --version
              vetra --help | head -20

              # Provision the Playwright harness in a writable workdir. The ESM
              # harness (import.meta, .js specifiers) needs the nearest package.json
              # to declare type=module so Playwrights TS loader treats it as ESM.
              mkdir -p /work && cp -R /e2e-src /work/e2e
              cd /work
              printf "{\"type\":\"module\"}\n" > /work/package.json
              npm install --no-save @playwright/test@^1.61.0 tsx@^4.19.0
              npx playwright install --with-deps chromium

              # Drive the replay against the GLOBAL vetra.
              export VETRA_E2E_BOOT_CMD=vetra
              set +e
              npx playwright test --config /work/e2e/playwright.config.ts
              rc=$?
              set -e
              cp -R /work/e2e/.cache/. /out/ 2>/dev/null || true
              cp -R /work/e2e/playwright-report /out/ 2>/dev/null || true
              exit $rc
            '

      - name: Upload global-install replay artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: global-install-replay-${{ matrix.pm }}
          path: ${{ github.workspace }}/e2e-cache/
          retention-days: 7
