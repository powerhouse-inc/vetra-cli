name: release

# Publish vetra-app + vetra-cli to the Vetra npm registries.
# Version bumps / dep updates happen in a prior manual commit — this workflow
# builds and publishes whatever version is committed on the branch it runs from.
#
#   branch      dist-tag   registries
#   main        dev        registry.dev.vetra.io + registry.vetra.io
#   production  latest     registry.dev.vetra.io + registry.vetra.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRIES: https://registry.dev.vetra.io https://registry.vetra.io

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve dist-tag from branch
        id: meta
        run: |
          case "${{ github.ref_name }}" in
            main)       echo "tag=dev"    >> "$GITHUB_OUTPUT" ;;
            production) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::release runs from main or production only (got ${{ github.ref_name }})"; exit 1 ;;
          esac

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build (vetra-app + connect bundle + vetra-cli)
        run: pnpm build

      # npm applies the tarball's publishConfig.registry OVER the --registry
      # flag, which would pin every publish to one registry. Drop the field in
      # the CI checkout (never committed) so --registry decides per publish.
      - name: Drop publishConfig.registry
        run: |
          (cd vetra-app && npm pkg delete publishConfig.registry)
          (cd vetra-cli && npm pkg delete publishConfig.registry)

      # pnpm pack resolves catalog:/workspace: specifiers into real versions;
      # publishing the source dir with npm would ship broken specs.
      - name: Pack tarballs
        run: |
          set -euo pipefail
          for pkg in vetra-app vetra-cli; do
            tgz="$(cd "$pkg" && pnpm pack | tail -1)"
            abs="$GITHUB_WORKSPACE/$pkg/$tgz"
            [ -f "$abs" ] || { echo "::error::pnpm pack produced no tarball for $pkg"; exit 1; }
            if tar -xzO -f "$abs" package/package.json | grep -E 'catalog:|workspace:'; then
              echo "::error::$pkg tarball has unresolved catalog:/workspace: specs"; exit 1
            fi
            var="$(echo "$pkg" | tr 'a-z-' 'A-Z_')_TGZ"
            echo "$var=$abs" >> "$GITHUB_ENV"
          done

      - name: Guard registry credentials
        env:
          DEV_USER: ${{ secrets.VETRA_REGISTRY_DEV_USER }}
          DEV_PASSWORD: ${{ secrets.VETRA_REGISTRY_DEV_PASSWORD }}
          PROD_USER: ${{ secrets.VETRA_REGISTRY_PROD_USER }}
          PROD_PASSWORD: ${{ secrets.VETRA_REGISTRY_PROD_PASSWORD }}
        run: |
          for s in DEV_USER DEV_PASSWORD PROD_USER PROD_PASSWORD; do
            [ -n "${!s}" ] || { echo "::error::secret VETRA_REGISTRY_$s is not set"; exit 1; }
          done

      - name: Publish
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          DEV_USER: ${{ secrets.VETRA_REGISTRY_DEV_USER }}
          DEV_PASSWORD: ${{ secrets.VETRA_REGISTRY_DEV_PASSWORD }}
          PROD_USER: ${{ secrets.VETRA_REGISTRY_PROD_USER }}
          PROD_PASSWORD: ${{ secrets.VETRA_REGISTRY_PROD_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./vetra-cli/package.json').version")

          # Registry auth tokens are 300s JWTs (even on the htpasswd path), so
          # a stored token secret would be dead on arrival — log in with
          # user/password and mint a fresh token right before each registry's
          # publishes instead. JSON is built by node so special characters in
          # the password survive; retries re-roll the pod behind the LB (the
          # registries keep per-pod htpasswd state).
          try_login() { # <registry> <user> — password from MINT_PASS
            local reg="$1" code token
            local body
            body=$(MINT_USER="$2" node -e 'console.log(JSON.stringify({name:process.env.MINT_USER,password:process.env.MINT_PASS.trim()}))')
            code=$(curl -s -o /tmp/login-resp.json -w '%{http_code}' -X PUT \
              "$reg/-/user/org.couchdb.user:$2" \
              -H 'content-type: application/json' -d "$body")
            if [ "$code" = "201" ] || [ "$code" = "200" ]; then
              token=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/login-resp.json","utf8")).token')
              echo "::add-mask::$token"
              echo "//${reg#https://}/:_authToken=$token" >> ~/.npmrc
              return 0
            fi
            echo "login as $2 to $reg failed: HTTP $code $(cat /tmp/login-resp.json)"
            return 1
          }

          mint_token() { # <registry> <user> <password>
            local reg="$1" user="$2" attempt
            export MINT_PASS="$3"
            for attempt in 1 2 3; do
              try_login "$reg" "$user" && return 0
              sleep 2
            done
            # The registries keep per-pod ephemeral htpasswd state, so a fixed
            # user can hit a pod holding a mismatched entry (409). They allow
            # open self-registration, so fall back to a unique per-run user.
            echo "::warning::falling back to per-run user $user-r$GITHUB_RUN_ID on $reg"
            try_login "$reg" "$user-r$GITHUB_RUN_ID" && return 0
            echo "::error::login to $reg failed"
            return 1
          }

          publish_one() { # <tarball> <name> <registry>
            local tgz="$1" name="$2" reg="$3"
            # Skip-if-exists keeps reruns idempotent (a republish would 409);
            # still point the dist-tag at the version.
            if curl -sfo /dev/null "$reg/$name/$VERSION?cb=$RANDOM"; then
              echo "$name@$VERSION already on $reg — ensuring dist-tag '$TAG'"
              npm dist-tag add "$name@$VERSION" "$TAG" --registry "$reg"
            else
              npm publish "$tgz" --registry "$reg" --tag "$TAG"
            fi
          }

          for reg in $REGISTRIES; do
            case "$reg" in
              *dev.vetra.io*) mint_token "$reg" "$DEV_USER" "$DEV_PASSWORD" ;;
              *)              mint_token "$reg" "$PROD_USER" "$PROD_PASSWORD" ;;
            esac
            # vetra-app first so vetra-cli never references an unpublished dep.
            publish_one "$VETRA_APP_TGZ" vetra-app "$reg"
            publish_one "$VETRA_CLI_TGZ" vetra-cli "$reg"
          done

      # npm view serves stale data for minutes after a publish — use the
      # cache-busted dist-tags endpoint.
      - name: Verify dist-tags
        run: |
          for reg in $REGISTRIES; do
            for pkg in vetra-app vetra-cli; do
              echo "== $reg  $pkg"
              curl -s "$reg/-/package/$pkg/dist-tags?cb=$RANDOM"; echo
            done
          done
