name: release

# Publish vetra-app + vetra to the public npm registry (registry.npmjs.org).
# Version bumps / dep updates happen in a prior manual commit — this workflow
# builds and publishes whatever version is committed on the branch it runs from.
#
#   branch      dist-tag
#   main        dev
#   production  latest
#
# Auth is OIDC Trusted Publishing — no stored npm token. The job requests a
# short-lived OIDC identity (`id-token: write`); npm (>= 11.5.1) exchanges it
# for a publish credential when a Trusted Publisher for THIS repo + workflow is
# configured on each package at npmjs.com. Publishing also emits provenance.
# One-time npmjs setup (per package, both `vetra` and `vetra-app`):
#   npmjs.com -> package -> Settings -> Trusted Publishers -> GitHub Actions,
#   repo = <owner>/<repo>, workflow = release.yml.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC Trusted Publishing + provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve dist-tag from branch
        id: meta
        run: |
          case "${{ github.ref_name }}" in
            main)       echo "tag=dev"    >> "$GITHUB_OUTPUT" ;;
            production) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::release runs from main or production only (got ${{ github.ref_name }})"; exit 1 ;;
          esac

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Trusted Publishing + provenance need npm >= 11.5.1; ensure it regardless
      # of the npm bundled with the Node release.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build (vetra-app + connect bundle + vetra)
        run: pnpm build

      # pnpm pack resolves catalog:/workspace: specifiers into real versions;
      # publishing the source dir with npm would ship broken specs. Tarball
      # names come from the package name (vetra-app-*.tgz, vetra-*.tgz); the
      # loop var is the directory (vetra-cli/), and its uppercased form keys the
      # tarball path env var (VETRA_APP_TGZ / VETRA_CLI_TGZ).
      - name: Pack tarballs
        run: |
          set -euo pipefail
          for pkg in vetra-app vetra-cli; do
            tgz="$(cd "$pkg" && pnpm pack | tail -1)"
            abs="$GITHUB_WORKSPACE/$pkg/$tgz"
            [ -f "$abs" ] || { echo "::error::pnpm pack produced no tarball for $pkg"; exit 1; }
            if tar -xzO -f "$abs" package/package.json | grep -E 'catalog:|workspace:'; then
              echo "::error::$pkg tarball has unresolved catalog:/workspace: specs"; exit 1
            fi
            var="$(echo "$pkg" | tr 'a-z-' 'A-Z_')_TGZ"
            echo "$var=$abs" >> "$GITHUB_ENV"
          done

      - name: Publish to npm
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./vetra-cli/package.json').version")

          # OIDC credentials are publish-scoped only: npm publish is authorized,
          # but dist-tag/deprecate are not. So a re-run on an already-published
          # version is skipped (the tag was set at first publish via --tag); it
          # is not re-pointed. Each release normally carries a fresh version.
          publish_one() { # <tarball> <name>
            local tgz="$1" name="$2"
            if curl -sfo /dev/null "https://registry.npmjs.org/$name/$VERSION"; then
              echo "$name@$VERSION already on npm — skipping"
            else
              npm publish "$tgz" --tag "$TAG" --access public --provenance
            fi
          }

          # vetra-app first so vetra never references an unpublished dep.
          publish_one "$VETRA_APP_TGZ" vetra-app
          publish_one "$VETRA_CLI_TGZ" vetra

      # npm view serves stale data for minutes after a publish — use the
      # cache-busted dist-tags endpoint.
      - name: Verify dist-tags
        run: |
          for pkg in vetra-app vetra; do
            echo "== $pkg"
            curl -s "https://registry.npmjs.org/-/package/$pkg/dist-tags?cb=$RANDOM"; echo
          done
