name: provision-credential

# One-off: issue a Renown delegation credential from the publisher wallet to the
# CI app DID, so the registry authorizes vetra-cli publishes. Re-run near expiry.

on:
  workflow_dispatch:
    inputs:
      switchboard_url:
        description: Switchboard graphql endpoint the registry's Renown reads from
        required: true
        default: https://switchboard.renown.vetra.io/graphql
      expires_days:
        description: Credential lifetime in days
        required: true
        default: "365"

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Guard secrets
        env:
          WALLET_KEY: ${{ secrets.VETRA_REGISTRY_WALLET_KEY }}
          RENOWN_KEY: ${{ secrets.VETRA_REGISTRY_RENOWN_KEY }}
        run: |
          for s in WALLET_KEY RENOWN_KEY; do
            [ -n "${!s}" ] || { echo "::error::secret VETRA_REGISTRY_$s is not set"; exit 1; }
          done

      - name: Issue and store credential
        working-directory: vetra-cli
        env:
          VETRA_REGISTRY_WALLET_KEY: ${{ secrets.VETRA_REGISTRY_WALLET_KEY }}
          PH_RENOWN_PRIVATE_KEY: ${{ secrets.VETRA_REGISTRY_RENOWN_KEY }}
          PH_RENOWN_SWITCHBOARD_URL: ${{ inputs.switchboard_url }}
          PH_RENOWN_EXPIRES_DAYS: ${{ inputs.expires_days }}
        run: node scripts/publish/provision-credential.mjs
