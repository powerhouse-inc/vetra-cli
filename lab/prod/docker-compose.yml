# Isolated vetra deploy lab. Host ports are the base lab's +200 so this
# runs alongside it (base lab holds 4900-4904).
#
#   client -> nginx (npm-cache-proxy, :5100) -> edge verdaccio (dual uplink, :5102)
#          -> npm-cdn (:5104) -> upstream verdaccio (local origin / publish target, :5101)
#          -> real registry.npmjs.org for the dependency closure
#
# The deployed clint-runtime container joins `labnet` and reaches the registry
# at http://nginx:80 (see deploy-vetra.sh).
services:
  upstream:
    image: verdaccio/verdaccio:6
    volumes:
      - ./upstream/config.yaml:/verdaccio/conf/config.yaml:ro
      - upstream-storage:/verdaccio/storage
    expose: ["4873"]
    ports: ["5101:4873"]   # host access for publishing
    networks: [labnet]

  npm-cdn:
    image: nginx:1.27-alpine
    depends_on: [upstream]
    volumes:
      - ./npm-cdn/nginx.conf:/etc/nginx/nginx.conf:ro
      - npm-cdn-cache:/cache
    expose: ["80"]
    ports: ["5104:80"]
    networks: [labnet]

  edge:
    image: verdaccio/verdaccio:6
    depends_on: [npm-cdn]
    volumes:
      - ./edge/config.yaml:/verdaccio/conf/config.yaml:ro
      - edge-storage:/verdaccio/storage
    expose: ["4873"]
    ports: ["5102:4873"]   # host access for edge-direct checks
    networks: [labnet]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [edge]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/cache
    expose: ["80"]
    ports: ["5100:80"]     # host access — this is "registry.dev.vetra.io"
    networks: [labnet]

networks:
  labnet:
    name: labvcli_net

volumes:
  upstream-storage:
  edge-storage:
  nginx-cache:
  npm-cdn-cache:
