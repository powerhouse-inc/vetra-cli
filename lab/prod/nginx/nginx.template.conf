# Faithful copy of the prod npm-cache-proxy nginx.conf
# (powerhouse-k8s-hosting:infrastructure/npm-cache-proxy/nginx.conf),
# adapted for the lab: upstream and metadata TTL are templated, and a
# purge-bypass mechanism is added to test publisher-triggered invalidation.
worker_processes auto;
events { worker_connections 4096; }
http {
  proxy_cache_path /cache/data levels=1:2 keys_zone=npm:50m
                   max_size=2g inactive=30d use_temp_path=off;

  # Prod uses 30s for metadata. Templated so scenarios can sweep it.
  proxy_cache_valid 200 301 302 ${META_TTL};
  proxy_cache_valid 404 5s;

  proxy_cache_lock on;
  proxy_cache_lock_timeout 5s;

  # The crux of the 2026-06-02 incident: stale-while-revalidate +
  # stale-on-error. A failing background refresh keeps serving stale.
  proxy_cache_use_stale updating error timeout
                        http_500 http_502 http_503 http_504 http_429;
  proxy_cache_background_update ${BACKGROUND_UPDATE};
  proxy_cache_revalidate on;

  # verdaccio returns `Vary: Accept-Encoding`, so nginx would key a separate
  # cache entry per Accept-Encoding. The publish gate (curl) and the build
  # (pnpm/undici) send different Accept-Encoding, hitting different entries —
  # the gate would confirm a fresh variant while the build reads a stale one.
  # Ignore Vary so one URI = one entry; a gate refresh then serves the build.
  proxy_ignore_headers Vary;

  # Prod uses $host (registry is on :443, no port to lose). The lab runs on a
  # non-standard port; $host drops it, so verdaccio rewrites dist.tarball to a
  # portless http://localhost/ that is unreachable from the build container.
  # $http_host preserves host:port so tarball URLs stay fetchable.
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # Prod hardcodes https (public ingress is TLS-only). The lab is http-only,
  # so this is templated — verdaccio rewrites tarball URLs from this value.
  proxy_set_header X-Forwarded-Proto ${XFP};
  proxy_set_header X-Real-IP $remote_addr;
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  proxy_buffering on;
  proxy_buffers 32 64k;
  proxy_busy_buffers_size 256k;
  client_max_body_size 1024m;
  proxy_read_timeout 120s;
  proxy_connect_timeout 30s;
  proxy_send_timeout 60s;

  log_format cache '$remote_addr $request_method $request_uri '
                  'status=$status cache=$upstream_cache_status '
                  'rt=$request_time urt=$upstream_response_time';
  access_log /dev/stdout cache;
  error_log /dev/stderr warn;

  upstream registry {
${NGINX_UPSTREAM}
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;
    set $bypass 0;
    set $nocache 0;

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

    location / {
      proxy_pass http://registry;

      # Publish/auth endpoints: bypass cache AND don't store the response.
      if ($request_method !~ ^(GET|HEAD)$) { set $bypass 1; set $nocache 1; }
      if ($request_uri ~* "^/-/(whoami|user|npm/v1/user|npm/v1/tokens|ping)(/|$|\?)") { set $bypass 1; set $nocache 1; }

      # FIX UNDER TEST: a trusted purge token forces a cache bypass so the
      # request re-fetches from verdaccio — but leaves $nocache=0 so the
      # fresh packument is re-STORED, refreshing the entry. Stock-nginx
      # equivalent of a targeted purge (the prod image has no ngx_cache_purge).
      if ($http_x_purge_token = "${PURGE_TOKEN}") { set $bypass 1; }

      proxy_cache_bypass $bypass;
      proxy_no_cache $nocache;

      proxy_cache npm;
      proxy_cache_key "$scheme$proxy_host$request_uri";

      location ~* /-/[^/]+\.tgz$ {
        proxy_pass http://registry;
        proxy_cache npm;
        proxy_cache_key "$scheme$proxy_host$request_uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 5s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale updating error timeout
                              http_500 http_502 http_503 http_504 http_429;
        add_header X-Cache-Status $upstream_cache_status always;
      }

      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
