# Mock of npm's read-path propagation lag. Caching proxy in front of the
# npm-origin verdaccio: a version published to the origin is not visible
# through here until this cache's TTL (${PROP_DELAY}) expires. Models the
# real registry.npmjs.org behaviour where reads lag writes, WITHOUT any
# dependency on the public internet. The edge registry uplinks from THIS,
# not from the origin directly.
worker_processes auto;
events { worker_connections 1024; }
http {
  proxy_cache_path /cache/data levels=1:2 keys_zone=npmcdn:20m
                   max_size=1g inactive=30d use_temp_path=off;

  # The propagation lag. No revalidate: while fresh, serve cached even if
  # the uplink sends a conditional request — that's what makes the lag real.
  proxy_cache_valid 200 301 302 ${PROP_DELAY};
  proxy_cache_valid 404 ${PROP_DELAY};
  proxy_cache_key "$request_method$request_uri";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto http;
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  log_format cdn '$request_method $request_uri status=$status cache=$upstream_cache_status';
  access_log /dev/stdout cdn;

  upstream origin { server upstream:4873; keepalive 8; }

  server {
    listen 80;
    server_name _;
    location = /healthz { access_log off; return 200 'ok'; }
    location / {
      proxy_pass http://origin;
      # Publishes (non-GET) must reach the origin uncached. (The edge only
      # reads through here; the host publishes to the origin directly.)
      proxy_cache npmcdn;
      proxy_cache_methods GET HEAD;
      add_header X-Cdn-Cache $upstream_cache_status always;
    }
  }
}
